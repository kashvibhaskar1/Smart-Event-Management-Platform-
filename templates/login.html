<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Registration Intelligence &amp; Attendee Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="auth-page">
  <div class="auth-shell" style="max-width: 440px;">
    <div class="glass-card">

      <div class="auth-logo-row">
        <div class="auth-logo-mark">RI</div>
        <div class="auth-logo-text">
          <div class="t1">Registration Intelligence</div>
          <div class="t2">Attendee Management</div>
        </div>
      </div>

      <div class="auth-header">
        <h1>Admin Login</h1>
        <p>Sign in to access the event dashboard.</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert-box {% if category == 'success' %}alert-success{% else %}alert-error{% endif %}">
              <i class="bi {% if category == 'success' %}bi-check-circle-fill{% else %}bi-exclamation-triangle-fill{% endif %}"></i>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="/login" method="POST" novalidate>
        <div class="form-grid" style="grid-template-columns: 1fr;">
          <div class="form-group full">
            <label class="form-label" for="username"><i class="bi bi-person-fill"></i> Username <span class="req">*</span></label>
            <div class="input-icon-wrap">
              <i class="bi bi-person"></i>
              <input type="text" class="form-input" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>
          </div>
          <div class="form-group full">
            <label class="form-label" for="password"><i class="bi bi-lock-fill"></i> Password <span class="req">*</span></label>
            <div class="input-icon-wrap">
              <i class="bi bi-lock"></i>
              <input type="password" class="form-input" id="password" name="password" placeholder="Enter your password" required>
            </div>
          </div>
        </div>
        <button type="submit" class="btn-register">
          <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
      </form>

      <div class="auth-footer-note">
        <a href="/">&larr; Back to Home</a>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
